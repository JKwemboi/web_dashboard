{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Drone Control</title>

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">


        <style>
            body {
                background: #0f172a;
                color: #e2e8f0;
                font-family: 'Segoe UI', sans-serif;
            }

            .control-container {
                max-width: 900px;
                margin: auto;
                margin-top: 40px;
            }

            .card {
                background: #020617;
                border: 1px solid #1e293b;
                border-radius: 16px;
            }

            .control-btn {
                width: 70px;
                height: 70px;
                font-size: 24px;
                margin: 5px;
                border-radius: 12px;
            }

            .status-box {
                background: #020617;
                border: 1px solid #1e293b;
                padding: 15px;
                border-radius: 12px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <script src="{% static 'js/drone.js' %}"></script>

    <body>

        <div class="container control-container">

            <div class="card p-4">
                <h3 class="mb-4 text-center">🚁 Drone Control Panel</h3>

                <div class="row">

                    <!-- CONTROLS -->
                    <div class="col-md-6 text-center">

                        <h5 textcolor="white">Movement</h5>

                        <button class="btn btn-success control-btn" onclick="sendCommand('up')">↑</button>

                        <div>
                            <button class="btn btn-success control-btn" onclick="sendCommand('left')">←</button>
                            <button class="btn btn-danger control-btn" onclick="sendCommand('stop')">■</button>
                            <button class="btn btn-success control-btn" onclick="sendCommand('right')">→</button>
                        </div>

                        <button class="btn btn-success control-btn" onclick="sendCommand('down')">↓</button>

                        <div class="mt-4">
                            <button class="btn btn-primary me-2" onclick="sendCommand('takeoff')">Take Off</button>
                            <button class="btn btn-warning" onclick="sendCommand('land')">Land</button>
                        </div>

                    </div>

                    <!-- STATUS -->
                    <div class="col-md-6">

                        <h5>Status</h5>

                        <div class="status-box">📡 Signal: <strong id="signal">Strong</strong></div>
                        <div class="status-box">🔋 Battery: <strong id="battery">85%</strong></div>
                        <div class="status-box">📏 Altitude: <strong id="altitude">12m</strong></div>
                        <div class="status-box">🧭 Direction: <strong id="direction">North</strong></div>

                        <hr>

                        <h6>Speed Control</h6>
                        <input type="range" min="0" max="100" class="form-range" onchange="updateSpeed(this.value)">
                    </div>

                </div>

                <!-- BACK BUTTON -->
                <div class="text-center mt-4">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                        ← Back to Dashboard
                    </a>
                </div>

            </div>

        </div>

        <script>
            function sendCommand(command) {
                fetch("{% url 'drone_control' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },
                    body: JSON.stringify({ command: command })
                })
                    .then(res => res.json())
                    .then(data => console.log(data));
            }

            function updateSpeed(value) {
                sendCommand("speed_" + value);
            }

            function getCSRFToken() {
                return document.cookie.split('; ')
                    .find(row => row.startsWith('csrftoken'))
                    .split('=')[1];
            }
        </script>

    </body>

</html>
