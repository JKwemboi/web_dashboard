{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Drone Control</title>

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">


        <style>
            body {
                background: #0f172a;
                color: #e2e8f0;
                font-family: 'Segoe UI', sans-serif;
            }

            .control-container {
                max-width: 900px;
                margin: auto;
                margin-top: 40px;
            }

            .card {
                background: #020617;
                border: 1px solid #1e293b;
                border-radius: 16px;
            }

            .control-btn {
                width: 70px;
                height: 70px;
                font-size: 24px;
                margin: 5px;
                border-radius: 12px;
            }

            .status-box {
                background: #020617;
                border: 1px solid #1e293b;
                padding: 15px;
                border-radius: 12px;
                margin-bottom: 10px;
            }
        </style>
    </head>
    <script src="{% static 'js/drone.js' %}"></script>

    <body>

        <div class="container control-container">

            <div class="container control-container">

                <div class="card p-4">
                    <h3 class="mb-4 text-center">🚁 Drone Control & Live Feed</h3>

                    <div class="row">

                        <!-- LEFT: LIVE VIDEO -->
                        <div class="col-md-7">
                            <h5>📡 Live Feed</h5>

                            <div class="live-feed-box">
                                <img src="/video_feed" id="videoFeed" class="w-100">
                            </div>

                            <div class="mt-2 text-end">
                                <span class="badge bg-success">LIVE</span>
                            </div>
                        </div>

                        <!-- RIGHT: CONTROLS -->
                        <div class="col-md-5 text-center">

                            <h5>🎮 Controls</h5>

                            <!-- UP -->
                            <button class="btn btn-success control-btn" onclick="sendCommand('up')">↑</button>

                            <div>
                                <button class="btn btn-success control-btn" onclick="sendCommand('left')">←</button>
                                <button class="btn btn-danger control-btn" onclick="sendCommand('stop')">■</button>
                                <button class="btn btn-success control-btn" onclick="sendCommand('right')">→</button>
                            </div>

                            <button class="btn btn-success control-btn" onclick="sendCommand('down')">↓</button>

                            <div class="mt-4">
                                <button class="btn btn-primary me-2" onclick="sendCommand('takeoff')">Take Off</button>
                                <button class="btn btn-warning" onclick="sendCommand('land')">Land</button>
                            </div>

                            <hr>

                            <!-- STATUS -->
                            <div class="status-box">🔋 Battery: <span id="battery">85%</span></div>
                            <div class="status-box">📡 Signal: <span id="signal">Strong</span></div>

                        </div>

                    </div>
                </div>

            </div>

        </div>

        <script>
            function sendCommand(command) {
                fetch("{% url 'drone_control' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },
                    body: JSON.stringify({ command: command })
                })
                    .then(res => res.json())
                    .then(data => console.log(data));
            }

            function updateSpeed(value) {
                sendCommand("speed_" + value);
            }

            function getCSRFToken() {
                return document.cookie.split('; ')
                    .find(row => row.startsWith('csrftoken'))
                    .split('=')[1];
            }
        </script>

    </body>

</html>
