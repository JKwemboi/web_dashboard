{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forgot Password</title>

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'icons/fontawesome/css/fontawesome.min.css' %}" rel="stylesheet">
        <link href="{% static 'icons/fontawesome/css/solid.min.css' %}" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    </head>

    <body class="auth-body">

        <!-- Floating Icons -->
        <div class="floating-elements">
            <i class="fas fa-lock floating-icon"></i>
            <i class="fas fa-key floating-icon"></i>
            <i class="fas fa-shield-alt floating-icon"></i>
        </div>

        <div class="login-container">
            <div class="login-card">

                <!-- LOGO -->
                <div class="logo text-center mb-4">
                    <a href="{% url 'login' %}">
                        <img src="{% static 'images/logo.png' %}" class="large-logo-img" alt="logo">
                    </a>
                </div>

                <h4 class="text-center mb-3">🔐 Reset Your Password</h4>
                <p class="text-center text-muted mb-4">
                    Enter your email and we’ll send you reset instructions.
                </p>

                <!-- ALERT MESSAGES -->
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
                {% endfor %}
                {% endif %}

                <!-- FORM -->
                <form method="POST">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                        <label><i class="fas fa-envelope me-2"></i>Email Address</label>
                    </div>

                    <button type="submit" class="btn btn-login w-100 mb-3">
                        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                    </button>
                </form>

                <!-- LINKS -->
                <div class="text-center">
                    <p class="text-muted mb-1">
                        Remember your password?
                        <a href="{% url 'login' %}">Login</a>
                    </p>

                    <p class="text-muted mb-0">
                        Don’t have an account?
                        <a href="{% url 'signup' %}">Sign up</a>
                    </p>
                </div>

            </div>
        </div>

        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    </body>

</html>
