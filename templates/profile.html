{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile</title>

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
        <link href="{% static 'icons/fontawesome/css/fontawesome.min.css' %}" rel="stylesheet">

        <style>
            body {
                background: #0f172a;
                color: #e2e8f0;
            }

            .profile-card {
                background: #020617;
                border: 1px solid #1e293b;
                border-radius: 12px;
                padding: 25px;
            }

            .profile-img {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                object-fit: cover;
            }

            .form-control {
                background: #020617;
                color: white;
                border: 1px solid #1e293b;
            }
        </style>
    </head>

    <body>

        <div class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="profile-card text-center">

                        <!-- PROFILE IMAGE -->
                        <img src="{% static 'images/avatar-6.png' %}" class="profile-img mb-3">

                        <h4>{{ user.username }}</h4>
                        <p class="text-muted">{{ user.email }}</p>

                        <hr>

                        <!-- PROFILE FORM -->
                        <form method="POST">
                            {% csrf_token %}

                            <div class="mb-3 text-start">
                                <label>First Name</label>
                                <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                            </div>

                            <div class="mb-3 text-start">
                                <label>Last Name</label>
                                <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                            </div>

                            <div class="mb-3 text-start">
                                <label>Email</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email }}">
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                💾 Update Profile
                            </button>
                        </form>

                        <!-- EXTRA INFO -->
                        <div class="mt-4 text-start">
                            <p><strong>Username:</strong> {{ user.username }}</p>
                            <p><strong>Date Joined:</strong> {{ user.date_joined|date:"M d, Y" }}</p>
                            <p><strong>Last Login:</strong> {{ user.last_login|date:"M d, Y H:i" }}</p>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </body>

</html>
