{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Settings</title>

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

        <style>
            body {
                background: #0f172a;
                color: #e2e8f0;
            }

            .card {
                background: #020617;
                border: 1px solid #1e293b;
                border-radius: 12px;
            }

            .form-control,
            .form-select {
                background: #020617;
                color: white;
                border: 1px solid #1e293b;
            }

            .form-control:focus {
                background: #020617;
                color: white;
            }
        </style>
    </head>

    <body>

        <div class="container mt-4">

            <h3 class="mb-4">⚙️ System Settings</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- DRONE SETTINGS -->
                    <div class="col-md-6">
                        <div class="card p-3 mb-3">
                            <h5>🚁 Drone Settings</h5>

                            <label class="mt-2">Drone Name</label>
                            <input type="text" name="drone_name" class="form-control" value="{{ settings.drone_name }}">

                            <label class="mt-3">Max Speed</label>
                            <input type="number" name="max_speed" class="form-control" value="{{ settings.max_speed }}">

                            <label class="mt-3">Auto Patrol</label>
                            <select name="auto_patrol" class="form-select">
                                <option value="on" {% if settings.auto_patrol %}selected{% endif %}>Enabled</option>
                                <option value="off" {% if not settings.auto_patrol %}selected{% endif %}>Disabled
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- AI SETTINGS -->
                    <div class="col-md-6">
                        <div class="card p-3 mb-3">
                            <h5>🤖 AI Detection Settings</h5>

                            <label class="mt-2">Detection Confidence (%)</label>
                            <input type="number" name="confidence" class="form-control"
                                value="{{ settings.confidence }}">

                            <label class="mt-3">Alert on Detection</label>
                            <select name="alert_enabled" class="form-select">
                                <option value="on" {% if settings.alert_enabled %}selected{% endif %}>Yes</option>
                                <option value="off" {% if not settings.alert_enabled %}selected{% endif %}>No</option>
                            </select>

                            <label class="mt-3">Save Images</label>
                            <select name="save_images" class="form-select">
                                <option value="on" {% if settings.save_images %}selected{% endif %}>Yes</option>
                                <option value="off" {% if not settings.save_images %}selected{% endif %}>No</option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="row">

                    <!-- ALERT SETTINGS -->
                    <div class="col-md-6">
                        <div class="card p-3 mb-3">
                            <h5>🚨 Alert Settings</h5>

                            <label class="mt-2">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ settings.phone }}">

                            <label class="mt-3">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ settings.email }}">
                        </div>
                    </div>

                    <!-- SYSTEM SETTINGS -->
                    <div class="col-md-6">
                        <div class="card p-3 mb-3">
                            <h5>🖥️ System</h5>

                            <label class="mt-2">Theme</label>
                            <select name="theme" class="form-select">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                            </select>

                            <label class="mt-3">Refresh Rate (seconds)</label>
                            <input type="number" name="refresh_rate" class="form-control"
                                value="{{ settings.refresh_rate }}">
                        </div>
                    </div>

                </div>

                <!-- SAVE BUTTON -->
                <div class="text-end mt-3">
                    <button type="submit" class="btn btn-success">
                        💾 Save Settings
                    </button>
                </div>

            </form>

        </div>

    </body>

</html>
