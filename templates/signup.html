
{% extends 'auth.html' %}
{% load static %}
{% block content %}
<div class="login-container">
    <div class="login-card">

        <div class="logo text-center mb-5">
            <a href="login.html"><img src="{% static 'images/logo.png' %}" class="large-logo-img" alt="logo large"></a>
        </div>

        <form action="signup" method="post">
            {% csrf_token %}

            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="first_name" placeholder="Enter first name" required>
                <label for="first_name"><i class="fas fa-user me-2"></i>First Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="last_name" placeholder="Enter last name" required>
                <label for="last_name"><i class="fas fa-user me-2"></i>Last Name</label>
            </div>
                        <div class="form-floating mb-3">
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>
                <label for="username"><i class="fas fa-user me-2"></i>Username</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                <label for="email"><i class="fas fa-envelope me-2"></i>Email Address</label>
            </div>

            <div class="form-floating password-field mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                <button type="button" class="password-toggle">
                    <i class="fas fa-eye" id="passwordIcon"></i>
                </button>
            </div>

            <div class="form-floating password-field mb-3">
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password" required>
                <label for="confirm_password"><i class="fas fa-lock me-2"></i>Confirm Password</label>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-3">
                <i class="fas fa-sign-in-alt me-2"></i>Sign Up
            </button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-login">
            <a href="#" class="btn-social">
                <i class="fab fa-google"></i>
                Google
            </a>
            <a href="#" class="btn-social">
                <i class="fab fa-facebook-f"></i>
                Facebook
            </a>
        </div>

        <div class="signup-link">
            <p class="text-muted mb-0">Have an account? <a href="login.html">Sign In now</a></p>
        </div>
    </div>
</div>
{% endblock %}
