<!DOCTYPE html>
<html>

    <head>
        <title>Wildlife Dashboard</title>
    </head>

    <body>

        <h1>Wildlife Monitoring Dashboard</h1>

        <h2>Live Feed</h2>
        <img src="/video/" width="600">

        <h2>Recent Detections</h2>
        <ul>
            {% for d in detections %}
            <li>{{ d.label }} - {{ d.confidence }} - {{ d.timestamp }}</li>
            {% endfor %}
        </ul>

    </body>

</html>
